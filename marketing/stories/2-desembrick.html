<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body{background:#FFC42E;overflow:hidden}
.rays{position:absolute;left:50%;top:700px;width:3000px;height:3000px;margin:-1500px 0 0 -1500px;
 background:repeating-conic-gradient(#FFD45E 0 10deg,#FFC42E 10deg 20deg)}
.card{position:absolute;left:70px;right:70px;top:250px;background:#F7F6F2;border:6px solid #1C1B22;border-radius:40px;padding:70px 60px 60px;box-shadow:18px 18px 0 #1C1B22;transform:rotate(-2deg);text-align:center}
.card img{width:100%}
.burst{position:absolute;right:30px;top:90px;z-index:2;width:300px;height:300px;background:#D63A2F;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:52px;line-height:1;transform:rotate(14deg);
 clip-path:polygon(50% 0%,61% 18%,80% 8%,78% 30%,100% 32%,86% 50%,100% 68%,78% 70%,80% 92%,61% 82%,50% 100%,39% 82%,20% 92%,22% 70%,0% 68%,14% 50%,0% 32%,22% 30%,20% 8%,39% 18%)}
.claim{position:absolute;left:70px;right:70px;top:770px;text-align:center}
.claim h1{font-size:120px;line-height:.98;color:#1C1B22}
.claim h1 u{text-decoration:none;background:#2B6FE3;color:#fff;padding:0 18px;border-radius:16px;display:inline-block;transform:rotate(-3deg)}
.claim p{font-size:44px;margin-top:44px;font-weight:600}
.pill{display:inline-block;margin-top:40px;background:#1C1B22;color:#FFC42E;font-size:36px;padding:18px 34px;border-radius:999px}
.link{position:absolute;left:120px;right:120px;bottom:230px;height:200px;border:5px dashed #1C1B22;border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:34px;color:#1C1B22;background:rgba(255,255,255,.35)}
.arrow{position:absolute;left:0;right:0;bottom:440px;text-align:center;font-size:80px;letter-spacing:20px}
</style></head><body>
<div class="rays"></div>
<div class="card"><img src="logo.svg"></div>
<div class="burst d">GRÁTIS!</div>
<div class="claim">
 <h1 class="d">Cada peça de volta <u>no seu saco</u></h1>
 <p>Manda o manual em PDF. A gente devolve a lista de peças de cada saco.</p>
 <div class="pill m">Funciona com manuais LEGO®</div>
</div>
<div class="arrow">👇👇👇</div>
<div class="link m">Toque no link aqui</div>
</body></html>
