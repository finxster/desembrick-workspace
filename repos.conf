# Desembrick workspace repository configuration.
# Sourced by bin/desembrick. Must remain valid Bash.

DESEMBRICK_DEFAULT_BRANCH="main"

# Planned but not created yet: `api` (desembrick-api, Spring Boot) and `web`
# (desembrick-web, Vue). Commented placeholders below show what to uncomment
# once each repository exists.
DESEMBRICK_REPO_KEYS=(
  engine
  # api
  # web
)

# Python processing engine (PDF manual -> parts per bag). A CLI, not a server.
DESEMBRICK_REPO_FOLDER_engine="desembrick-engine"
# DESEMBRICK_REPO_FOLDER_api="desembrick-api"
# DESEMBRICK_REPO_FOLDER_web="desembrick-web"

DESEMBRICK_REPO_SSH_URL_engine="git@github.com:finxster/desembrick-engine.git"
# DESEMBRICK_REPO_SSH_URL_api="git@github.com:finxster/desembrick-api.git"
# DESEMBRICK_REPO_SSH_URL_web="git@github.com:finxster/desembrick-web.git"

DESEMBRICK_REPO_HTTPS_URL_engine="https://github.com/finxster/desembrick-engine.git"
# DESEMBRICK_REPO_HTTPS_URL_api="https://github.com/finxster/desembrick-api.git"
# DESEMBRICK_REPO_HTTPS_URL_web="https://github.com/finxster/desembrick-web.git"

# Runnable apps (long-lived processes with a port). The engine is a one-shot
# CLI, so it is deliberately absent: start/stop/restart/ps/logs refuse to run
# until an app is listed here.
DESEMBRICK_APP_KEYS=(
  # api
  # web
)

# Short aliases for repo/app names, as "alias:key" pairs (resolved by resolve_repo_key).
DESEMBRICK_ALIASES=(
  "eng:engine"
)

# REVIEW when the repos exist: start commands, ports and option templates.
# DESEMBRICK_APP_START_CMD_api="./gradlew bootRun"
# DESEMBRICK_APP_START_CMD_web="npm run dev"
# DESEMBRICK_APP_PORT_api="8080"
# DESEMBRICK_APP_PORT_web="5173"

# Templates appended by `start env=<profile>` and `start`/`logs port=<number>`.
# `%s` is the validated value. An app with no template refuses the option.
# DESEMBRICK_APP_ENV_ARG_api="--args=--spring.profiles.active=%s"
# DESEMBRICK_APP_PORT_ARG_api="--args=--server.port=%s"
# DESEMBRICK_APP_PORT_ARG_web="-- --port %s"

# Build commands. For the engine, "build" means running its test suite.
DESEMBRICK_REPO_BUILD_CMD_engine="uv run pytest"
# DESEMBRICK_REPO_BUILD_CMD_api="./gradlew clean build"
# DESEMBRICK_REPO_BUILD_CMD_web="npm run build"

# No library repos in this workspace, so no publish commands are configured.
